# Keeps the free-tier Render backend warm so it doesn't fall asleep when idle.
#
# Render's free tier sleeps after ~15 min with no incoming request and takes 1-2 min
# to wake. GitHub's own cron is too unreliable for this (scheduled runs were landing
# 3-7 hours apart), so each run here STAYS ALIVE for ~5h50m and pings /api/meta
# itself, at a RANDOM 5-13 min gap (no regular pattern, always inside the 15-min
# window). An hourly cron starts the next run; the concurrency group queues it so
# two runs never overlap, and it picks up as the previous one finishes.
#
# NOTE: GitHub Pages (the static site) can't run a timer. Only Actions can.
name: Keep-alive (Render backend)

on:
  schedule:
    - cron: "7 * * * *"
  # Manual trigger (e.g. right after a deploy, to start the loop immediately).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping the backend at random gaps for ~5h50m
        run: |
          URL="https://stream-finder-api.onrender.com/api/meta"
          END=$((SECONDS + 21000))
          while [ $SECONDS -lt $END ]; do
            ok=0
            for i in 1 2 3; do
              if curl -sf --max-time 90 -o /dev/null "$URL"; then ok=1; break; fi
              sleep 15
            done
            [ $ok = 1 ] && echo "$(date -u +%T) ping ok" || echo "$(date -u +%T) ping FAILED"
            GAP=$((300 + RANDOM % 481))   # 300-780s = 5-13 min
            echo "next ping in ${GAP}s"
            sleep $GAP
          done
