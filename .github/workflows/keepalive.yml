# Keeps the free-tier Render backend warm so it doesn't fall asleep when idle.
#
# Render's free tier sleeps after ~15 min of no traffic and takes 1-2 min to wake.
# A tiny GET to /api/meta (the same cheap endpoint the PWA calls on boot — it just
# returns config, no scraping) every 20 minutes resets Render's idle timer, so a
# real user's search lands on an already-awake server instead of a cold one.
#
# 20 min (not tighter) is deliberate: it's just inside Render's sleep window, so the
# service is kept alive without hammering the free instance (aggressive pinging risks
# being flagged as abuse and wastes the free allocation for no extra benefit).
#
# Runs on GitHub's always-on Actions infra — GitHub Pages itself can't run a timer.
name: Keep-alive (Render backend)

on:
  schedule:
    # Every 20 minutes.
    - cron: "*/20 * * * *"
  # Manual trigger (e.g. right after a deploy, to warm it before someone uses it).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend
        # -f = fail on HTTP errors so a down backend is visible in the run history;
        # --max-time keeps a hung wake from stalling the job; -o /dev/null = we only
        # care that it answers, not what it says. Retries up to 3x (a cold start can
        # take 60-120s; the first ping is usually the one that wakes it, so later
        # retries are cheap). A total failure just logs — the next 20-min tick retries.
        run: |
          for i in 1 2 3; do
            if curl -sf --max-time 90 -o /dev/null "https://stream-finder-api.onrender.com/api/meta"; then
              echo "backend answered on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, retrying in 10s…"
            sleep 10
          done
          echo "backend did not answer after 3 attempts" >&2
          exit 1
