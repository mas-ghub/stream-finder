# Keeps the free-tier Render backend warm so it doesn't fall asleep when idle.
#
# Render's free tier sleeps after ~15 min of no traffic and takes 1-2 min to wake.
# A tiny GET to /api/meta (the same cheap endpoint the PWA calls on boot — it just
# returns config, no scraping) resets Render's idle timer, so a real user's search
# lands on an already-awake server instead of a cold one.
#
# This is a SAFETY NET that runs whether or not the Mac is on. The Mac's own
# launchd keep-alive (sf-keepalive.sh) already pings while it's booted; this covers
# the "Mac is off" case. Two keep-alives hitting the same endpoint is harmless —
# each just resets the idle timer.
#
# Interval: a fixed 20-min cron, plus a randomized 0-600s sleep before the ping, so
# the pings don't land on a perfect regular beat (a metronome pattern is what looks
# like a bot and risks the free tier being flagged). 20 min sits just inside
# Render's sleep window, so the service stays awake without hammering it.
#
# NOTE: GitHub Pages (the static site) cannot do this — it can't run a timer.
# Only GitHub Actions (always-on infra) can. That's why this lives here.
name: Keep-alive (Render backend)

on:
  schedule:
    # Every 20 minutes. (GitHub's schedule runs on a shared pool and may batch
    # under load, but "every ~20 min" is all we need to beat the 15-min sleep.)
    - cron: "*/20 * * * *"
  # Manual trigger (e.g. right after a deploy, to warm it before someone uses it).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping the backend (with jitter)
        # $RANDOM gives 0-32767; mod 600 → a 0-2 min random delay so the pings
        # aren't on a fixed metronome. Then ping with a few retries (a cold start
        # can take 60-120s; the first ping is usually what wakes it).
        run: |
          echo "sleeping $((RANDOM % 120))s (randomized) before ping"
          sleep $((RANDOM % 120))
          for i in 1 2 3; do
            if curl -sf --max-time 90 -o /dev/null "https://stream-finder-api.onrender.com/api/meta"; then
              echo "backend answered on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, retrying in 15s…"
            sleep 15
          done
          echo "backend did not answer after 3 attempts" >&2
          exit 1
