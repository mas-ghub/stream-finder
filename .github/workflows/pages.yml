# Deploys the static frontend to GitHub Pages.
#
# The whole repo IS the frontend (single-page app), so we just copy `./` into the
# Pages root. Everything the app needs (index.html, sw.js, manifest, icon) lives
# here — no backend, no API keys. Live data comes from your Mac's backend, which
# the user points at via Settings → Backend (or `?backend=...`).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site (frontend dir is the site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
